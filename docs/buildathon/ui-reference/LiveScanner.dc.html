<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Live Scanner camera</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
*{box-sizing:border-box}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
a:focus-visible,button:focus-visible{outline:3px solid #E3B660;outline-offset:3px}
@keyframes sv-flash{0%{opacity:.85}100%{opacity:0}}
@keyframes sv-drop{0%{transform:translate(0,-260px) scale(2.4);opacity:.4}100%{transform:none;opacity:1}}
@keyframes sv-spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.sv-anim{animation:none !important}}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; display: flex; flex-direction: column; background: #0E0E0E; color: #F5F4F2; font-family: 'DM Sans',system-ui,sans-serif; overflow: hidden">

<div style="position: absolute; left: 0; top: 0; right: 0; bottom: 0; background: radial-gradient(ellipse at 50% 42%, #4a4540 0%, #24221f 55%, #121110 100%)"></div>

<div style="position: absolute; left: 70px; top: 150px; width: 250px; height: 330px; transform: rotate(-4deg); background: #ECE7DB; border-radius: 4px; box-shadow: 0 24px 50px rgba(0,0,0,0.55); padding: 20px 18px; display: flex; flex-direction: column; gap: 10px; opacity: 0.92">
<span style="height: 7px; width: 70%; background: #2B2B2B; opacity: 0.5; border-radius: 3px"></span>
<span style="height: 2px; background: #2B2B2B; opacity: 0.4"></span>
<span style="height: 12px; width: 90%; background: #2B2B2B; opacity: 0.45; border-radius: 3px"></span>
<span style="height: 6px; width: 60%; background: #2B2B2B; opacity: 0.25; border-radius: 3px"></span>
<span style="height: 6px; width: 80%; background: #2B2B2B; opacity: 0.25; border-radius: 3px"></span>
<span style="height: 6px; width: 74%; background: #2B2B2B; opacity: 0.25; border-radius: 3px"></span>
<span style="height: 6px; width: 86%; background: #2B2B2B; opacity: 0.18; border-radius: 3px"></span>
<span style="height: 6px; width: 66%; background: #2B2B2B; opacity: 0.18; border-radius: 3px"></span>
<span style="height: 6px; width: 78%; background: #2B2B2B; opacity: 0.18; border-radius: 3px"></span>
</div>

<div style="position: absolute; left: 56px; top: 136px; width: 278px; height: 358px; border: 2.5px solid #E3B660; border-radius: 10px; background: rgba(227,182,96,0.08)"></div>

<div style="position: relative; z-index: 2; flex: none; height: 64px; display: flex; align-items: center; justify-content: space-between; padding: 0 10px">
<a href="VoiceHome.dc.html" aria-label="Close" style="width: 44px; height: 44px; border-radius: 22px; background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></a>
<span style="display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 14px; border-radius: 17px; background: rgba(0,0,0,0.5); font-size: 13.5px; font-weight: 700"><span style="width: 8px; height: 8px; border-radius: 4px; background: #E3B660"></span>{{ hint }}</span>
<button aria-label="Flash" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: rgba(0,0,0,0.4); color: #F5F4F2; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 3L5 14h6l-1 7 8-11h-6z"/></svg></button>
</div>

<div style="position: relative; z-index: 2; flex: 1"></div>

<sc-if value="{{ hasPages }}" hint-placeholder-val="{{ false }}">
<div style="position: relative; z-index: 2; flex: none; display: flex; align-items: center; justify-content: center; gap: 8px; padding-bottom: 12px">
<span style="display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px; border-radius: 16px; background: rgba(0,0,0,0.55); font-size: 13px; font-weight: 600"><span class="sv-anim" style="width: 14px; height: 14px; border-radius: 7px; border: 2.5px solid rgba(255,255,255,0.3); border-top-color: #E3B660; animation: sv-spin 0.9s linear infinite"></span>Gemini is reading in the background</span>
</div>
</sc-if>

<div style="position: relative; z-index: 2; flex: none; padding: 16px 18px 30px; background: rgba(10,10,10,0.75); display: flex; align-items: center; justify-content: space-between">

<div style="width: 92px; display: flex; justify-content: flex-start">
<sc-if value="{{ hasPages }}" hint-placeholder-val="{{ false }}">
<div style="position: relative; width: 52px; height: 64px">
<span style="position: absolute; left: 6px; top: -4px; width: 46px; height: 60px; border-radius: 5px; background: #D9D3C4; transform: rotate(6deg)"></span>
<span class="sv-anim" style="position: absolute; left: 0; top: 0; width: 46px; height: 60px; border-radius: 5px; background: #F4F0E6; border: 2px solid #F5F4F2; padding: 6px 5px; display: flex; flex-direction: column; gap: 3px; animation: sv-drop 0.45s ease both"><span style="height: 3px; background: #2B2B2B; opacity: 0.5"></span><span style="height: 3px; width: 80%; background: #2B2B2B; opacity: 0.2"></span><span style="height: 3px; width: 70%; background: #2B2B2B; opacity: 0.2"></span></span>
<span style="position: absolute; right: -10px; top: -10px; min-width: 24px; height: 24px; padding: 0 6px; border-radius: 12px; background: #C96846; color: #1B1B1B; border: 2px solid #0E0E0E; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{ count }}</span>
</div>
</sc-if>
<sc-if value="{{ noPages }}" hint-placeholder-val="{{ true }}">
<button aria-label="{{ muteLabel }}" aria-pressed="{{ muted }}" onClick="{{ toggleMute }}" style="width: 52px; height: 52px; border-radius: 26px; border: 0; background: {{ muteBg }}; color: {{ muteFg }}; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/><sc-if value="{{ muted }}" hint-placeholder-val="{{ false }}"><path d="M4 4l16 16"/></sc-if></svg></button>
</sc-if>
</div>

<button aria-label="Capture this page" onClick="{{ shoot }}" style="width: 76px; height: 76px; border-radius: 38px; border: 4px solid #F5F4F2; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer"><span style="width: 60px; height: 60px; border-radius: 30px; background: #F5F4F2"></span></button>

<div style="width: 92px; display: flex; justify-content: flex-end">
<sc-if value="{{ hasPages }}" hint-placeholder-val="{{ false }}">
<a href="LiveCaptured.dc.html" style="height: 52px; padding: 0 16px; border-radius: 26px; background: #E3B660; color: #1B1B1B; display: flex; align-items: center; gap: 6px; font-size: 15px; font-weight: 700">Proceed<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></a>
</sc-if>
<sc-if value="{{ noPages }}" hint-placeholder-val="{{ true }}">
<a href="VoiceHome.dc.html" style="height: 52px; padding: 0 18px; border-radius: 26px; background: rgba(255,255,255,0.14); color: #F5F4F2; display: flex; align-items: center; font-size: 15px; font-weight: 700">End</a>
</sc-if>
</div>
</div>

<sc-if value="{{ flash }}" hint-placeholder-val="{{ false }}">
<div class="sv-anim" style="position: absolute; left: 0; top: 0; right: 0; bottom: 0; z-index: 5; background: #fff; pointer-events: none; animation: sv-flash 0.35s ease both"></div>
</sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { count: 0, muted: false, flash: false };
this.t = null;
}
componentWillUnmount() { if (this.t) clearTimeout(this.t); }
renderVals() {
const s = this.state;
return {
count: s.count,
hasPages: s.count > 0,
noPages: s.count === 0,
hint: s.count === 0 ? 'Fit the page in the frame' : (s.count === 1 ? '1 page · add more or Proceed' : s.count + ' pages · add more or Proceed'),
flash: s.flash,
shoot: () => {
this.setState({ count: this.state.count + 1, flash: true });
if (this.t) clearTimeout(this.t);
this.t = setTimeout(() => this.setState({ flash: false }), 380);
},
muted: s.muted,
toggleMute: () => this.setState({ muted: !this.state.muted }),
muteLabel: s.muted ? 'Unmute microphone' : 'Mute microphone',
muteBg: s.muted ? '#F5F4F2' : 'rgba(255,255,255,0.14)',
muteFg: s.muted ? '#1B1B1B' : '#F5F4F2'
};
}
}
</script>
</body>
</html>
