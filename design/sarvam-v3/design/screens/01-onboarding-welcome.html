<script>
window.DCLogic = class { constructor(p){ this.props = p || {}; this.state = this.state || {}; } setState(s){ Object.assign(this.state, s); } };
function look(scope, path){ path = path.trim(); if (path === 'true') return true; if (path === 'false') return false;
  let v = scope; for (const k of path.split('.')) { if (v == null) return undefined; v = v[k]; } return v; }
function interp(str, scope){ return str.replace(/\{\{\s*([^}]+?)\s*\}\}/g, (m, p) => { const v = look(scope, p); return typeof v === 'function' ? '' : (v == null ? '' : String(v)); }); }
function expand(node, scope){
  for (const child of Array.from(node.childNodes)) {
    if (child.nodeType === 3) { child.textContent = interp(child.textContent, scope); continue; }
    if (child.nodeType !== 1) continue;
    const tag = child.tagName.toLowerCase();
    if (tag === 'sc-for') {
      const m = (child.getAttribute('list')||'').match(/\{\{\s*([^}]+?)\s*\}\}/); const list = m ? look(scope, m[1]) || [] : [];
      const as = child.getAttribute('as') || 'item'; const frag = document.createDocumentFragment();
      list.forEach((it, i) => { const wrap = document.createElement('div'); wrap.innerHTML = child.innerHTML; const s = Object.assign({}, scope, {[as]: it, $index: i}); expand(wrap, s); while (wrap.firstChild) frag.appendChild(wrap.firstChild); });
      child.replaceWith(frag); continue;
    }
    if (tag === 'sc-if') {
      const m = (child.getAttribute('value')||'').match(/\{\{\s*([^}]+?)\s*\}\}/); const ok = m ? !!look(scope, m[1]) : false;
      if (!ok) { child.remove(); continue; }
      const frag = document.createDocumentFragment(); expand(child, scope); while (child.firstChild) frag.appendChild(child.firstChild); child.replaceWith(frag); continue;
    }
    for (const a of Array.from(child.attributes)) { if (a.value.includes('{{')) child.setAttribute(a.name, interp(a.value, scope)); }
    expand(child, scope);
  }
}
window.addEventListener('DOMContentLoaded', () => {
  const sc = document.querySelector('script[data-dc-script]');
  const C = new Function(sc.textContent + '; return Component;')();
  const props = {}; try { const dp = JSON.parse(sc.getAttribute('data-props')||'{}'); for (const k in dp) if (dp[k] && 'default' in dp[k]) props[k] = dp[k].default; } catch(e){}
  const inst = new C(props); const vals = inst.renderVals();
  const xdc = document.querySelector('x-dc'); const helmet = xdc.querySelector('helmet');
  if (helmet) { document.head.insertAdjacentHTML('beforeend', helmet.innerHTML); helmet.remove(); }
  expand(xdc, vals); window.__ready = true; document.dispatchEvent(new Event('sv-ready'));
});
</script>
<style>
@keyframes sv-push-in{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes sv-back-in{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
@keyframes sv-sheet-up{from{transform:translateY(100%)}to{transform:none}}
@keyframes sv-scrim-in{from{opacity:0}to{opacity:1}}
@keyframes sv-fade-up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.sv-out{transition:opacity 160ms ease-in, transform 160ms ease-in;opacity:0;transform:translateX(-14px)}
.sv-out-back{transition:opacity 160ms ease-in, transform 160ms ease-in;opacity:0;transform:translateX(14px)}
.sv-sheet-out{transition:transform 200ms cubic-bezier(.4,0,1,1);transform:translateY(100%)}
@media (prefers-reduced-motion: reduce){*{animation-duration:1ms!important;animation-iteration-count:1!important;transition-duration:1ms!important}}
</style>
<script>
(function(){
  const SHEET = false;
  function root(){ const x = document.querySelector('x-dc'); return x && x.firstElementChild; }
  function sheetEl(r){ return r && Array.from(r.querySelectorAll('section')).find(s => s.style.position === 'absolute' && (s.style.borderRadius||'').startsWith('40px 40px')); }
  function enter(){
    const r = root(); if (!r) return;
    const back = location.hash === '#back';
    if (SHEET) {
      const s = sheetEl(r);
      r.style.animation = 'sv-scrim-in 200ms ease-out both';
      if (s) s.style.animation = back ? 'none' : 'sv-sheet-up 260ms cubic-bezier(.2,.8,.2,1) both';
    } else {
      r.style.animation = (back ? 'sv-back-in' : 'sv-push-in') + ' 280ms cubic-bezier(.2,.8,.2,1) both';
      const cards = Array.from(r.querySelectorAll('.stack > section, .stack > details, .stack > nav'));
      cards.slice(0, 10).forEach((c, i) => { c.style.animation = 'sv-fade-up 320ms cubic-bezier(.2,.8,.2,1) both'; c.style.animationDelay = (120 + i * 40) + 'ms'; });
    }
  }
  document.addEventListener('sv-ready', enter);
  document.addEventListener('click', (e) => {
    const a = e.target.closest('a[href]'); if (!a) return;
    const href = a.getAttribute('href'); if (!/^\d\d-[a-z0-9-]+\.html/.test(href)) return;
    e.preventDefault();
    const label = (a.getAttribute('aria-label') || '').toLowerCase();
    const back = label === 'back' || label === 'close';
    const r = root(); const s = sheetEl(r);
    if (SHEET && back && s) s.classList.add('sv-sheet-out'); else if (r) r.classList.add(back ? 'sv-out-back' : 'sv-out');
    setTimeout(() => { location.href = href + (back ? '#back' : ''); }, SHEET && back ? 200 : 160);
  });
})();
</script>

<x-dc>
<helmet>

@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F5F2; font-family: DM Sans, system-ui, sans-serif; color: #1A1A1A; padding: 20px 20px 28px; display: flex; flex-direction: column; gap: 22px">
  <div style="display: flex; align-items: center; justify-content: space-between">

    <sc-for list="{{greet}}" as="g" hint-placeholder-count="9">

  <div style="display: flex; align-items: center; justify-content: space-between">
    <span aria-label="Step 1 of 3" style="display: flex; gap: 6px"><span style="width: 26px; height: 8px; border-radius: 4px; background: #1A1A1A"></span><span style="width: 8px; height: 8px; border-radius: 4px; background: #C4C8C3"></span><span style="width: 8px; height: 8px; border-radius: 4px; background: #C4C8C3"></span></span>
    <a href="02-onboarding-simple-words.html" style="height: 56px; display: inline-flex; align-items: center; gap: 10px; padding: 0 26px; border-radius: 28px; border: 1.5px solid #1A1A1A; background: #E9B44C; color: #1A1A1A; font-size: 17px; font-weight: 700; text-decoration: none">Next<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1A1A1A" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const G = [
      ['வணக்கம்', 'Noto Sans Tamil', '#F4F5F2', '#1A1A1A'], ['नमस्ते', 'Noto Sans Devanagari', '#E9B44C', '#1A1A1A'], ['నమస్కారం', 'Noto Sans Telugu', '#D9603B', '#1A1A1A'],
      ['നമസ്കാരം', 'Noto Sans Malayalam', '#1A1A1A', '#F4F5F2'], ['नमस्कार', 'Noto Sans Devanagari', '#F4F5F2', '#1A1A1A'], ['নমস্কার', 'Noto Sans Bengali', '#E9B44C', '#1A1A1A'],
      ['ନମସ୍କାର', 'Noto Sans Oriya', '#D9603B', '#1A1A1A'], ['ನಮಸ್ಕಾರ', 'Noto Sans Kannada', '#1A1A1A', '#F4F5F2'], ['Hello', 'DM Sans', '#F4F5F2', '#1A1A1A']
    ];
    const shifts = [-46, 34, -22, 50, -54, 20, -30, 42, -6];
    const greet = G.map(([word, f, bg, ink], i) => ({
      word,
      style: 'position:relative;display:inline-flex;align-items:center;height:36px;padding:0 16px;border-radius:18px;border:1.5px solid #1A1A1A;font-size:16px;font-weight:600;font-family:' + f + ',sans-serif;background:' + bg + ';color:' + ink + ';margin-left:' + Math.round(shifts[i] * 1.4) + 'px;rotate:' + (i % 2 ? 3 : -3) + 'deg;animation-delay:' + (i * 0.35) + 's'
    }));
    return { greet };
  }
}
</script>
