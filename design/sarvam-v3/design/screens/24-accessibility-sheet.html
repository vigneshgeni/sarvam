<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>24 · Accessibility options</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
window.DCLogic = class { constructor(p){ this.props = p || {}; this.state = this.state || {}; } setState(s){ Object.assign(this.state, s); } };
function look(scope, path){ path = path.trim(); if (path === 'true') return true; if (path === 'false') return false;
  let v = scope; for (const k of path.split('.')) { if (v == null) return undefined; v = v[k]; } return v; }
function interp(str, scope){ return str.replace(/\{\{\s*([^}]+?)\s*\}\}/g, (m, p) => { const v = look(scope, p); return typeof v === 'function' ? '' : (v == null ? '' : String(v)); }); }
function expand(node, scope){
  for (const child of Array.from(node.childNodes)) {
    if (child.nodeType === 3) { child.textContent = interp(child.textContent, scope); continue; }
    if (child.nodeType !== 1) continue;
    const tag = child.tagName.toLowerCase();
    if (tag === 'sc-for') {
      const m = (child.getAttribute('list')||'').match(/\{\{\s*([^}]+?)\s*\}\}/); const list = m ? look(scope, m[1]) || [] : [];
      const as = child.getAttribute('as') || 'item'; const frag = document.createDocumentFragment();
      list.forEach((it, i) => { const wrap = document.createElement('div'); wrap.innerHTML = child.innerHTML; const s = Object.assign({}, scope, {[as]: it, $index: i}); expand(wrap, s); while (wrap.firstChild) frag.appendChild(wrap.firstChild); });
      child.replaceWith(frag); continue;
    }
    if (tag === 'sc-if') {
      const m = (child.getAttribute('value')||'').match(/\{\{\s*([^}]+?)\s*\}\}/); const ok = m ? !!look(scope, m[1]) : false;
      if (!ok) { child.remove(); continue; }
      const frag = document.createDocumentFragment(); expand(child, scope); while (child.firstChild) frag.appendChild(child.firstChild); child.replaceWith(frag); continue;
    }
    for (const a of Array.from(child.attributes)) { if (a.value.includes('{{')) child.setAttribute(a.name, interp(a.value, scope)); }
    expand(child, scope);
  }
}
window.addEventListener('DOMContentLoaded', () => {
  const sc = document.querySelector('script[data-dc-script]');
  const C = new Function(sc.textContent + '; return Component;')();
  const props = {}; try { const dp = JSON.parse(sc.getAttribute('data-props')||'{}'); for (const k in dp) if (dp[k] && 'default' in dp[k]) props[k] = dp[k].default; } catch(e){}
  const inst = new C(props); const vals = inst.renderVals();
  const xdc = document.querySelector('x-dc'); const helmet = xdc.querySelector('helmet');
  if (helmet) { document.head.insertAdjacentHTML('beforeend', helmet.innerHTML); helmet.remove(); }
  expand(xdc, vals); window.__ready = true; document.dispatchEvent(new Event('sv-ready'));
});
</script>
<style>
@keyframes sv-push-in{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes sv-back-in{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
@keyframes sv-sheet-up{from{transform:translateY(100%)}to{transform:none}}
@keyframes sv-scrim-in{from{opacity:0}to{opacity:1}}
@keyframes sv-fade-up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.sv-out{transition:opacity 160ms ease-in, transform 160ms ease-in;opacity:0;transform:translateX(-14px)}
.sv-out-back{transition:opacity 160ms ease-in, transform 160ms ease-in;opacity:0;transform:translateX(14px)}
.sv-sheet-out{transition:transform 200ms cubic-bezier(.4,0,1,1);transform:translateY(100%)}
@media (prefers-reduced-motion: reduce){*{animation-duration:1ms!important;animation-iteration-count:1!important;transition-duration:1ms!important}}
</style>
<script>
(function(){
  const SHEET = true;
  function root(){ const x = document.querySelector('x-dc'); return x && x.firstElementChild; }
  function sheetEl(r){ return r && Array.from(r.querySelectorAll('section')).find(s => s.style.position === 'absolute' && (s.style.borderRadius||'').startsWith('40px 40px')); }
  function enter(){
    const r = root(); if (!r) return;
    const back = location.hash === '#back';
    if (SHEET) {
      const s = sheetEl(r);
      r.style.animation = 'sv-scrim-in 200ms ease-out both';
      if (s) s.style.animation = back ? 'none' : 'sv-sheet-up 260ms cubic-bezier(.2,.8,.2,1) both';
    } else {
      r.style.animation = (back ? 'sv-back-in' : 'sv-push-in') + ' 280ms cubic-bezier(.2,.8,.2,1) both';
      const cards = Array.from(r.querySelectorAll('.stack > section, .stack > details, .stack > nav'));
      cards.slice(0, 10).forEach((c, i) => { c.style.animation = 'sv-fade-up 320ms cubic-bezier(.2,.8,.2,1) both'; c.style.animationDelay = (120 + i * 40) + 'ms'; });
    }
  }
  document.addEventListener('sv-ready', enter);
  document.addEventListener('click', (e) => {
    const a = e.target.closest('a[href]'); if (!a) return;
    const href = a.getAttribute('href'); if (!/^\d\d-[a-z0-9-]+\.html/.test(href)) return;
    e.preventDefault();
    const label = (a.getAttribute('aria-label') || '').toLowerCase();
    const back = label === 'back' || label === 'close';
    const r = root(); const s = sheetEl(r);
    if (SHEET && back && s) s.classList.add('sv-sheet-out'); else if (r) r.classList.add(back ? 'sv-out-back' : 'sv-out');
    setTimeout(() => { location.href = href + (back ? '#back' : ''); }, SHEET && back ? 200 : 160);
  });
})();
</script>
<style>html,body{background:#E8EAE7}body{margin:0}x-dc>div{margin:0 auto}</style>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
body{margin:0}
a{color:#034F46}a:hover{color:#1A1A1A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #8A8F8C; font-family: DM Sans, system-ui, sans-serif; color: #1A1A1A; position: relative; overflow: hidden">
  <div aria-hidden="true" style="padding: 24px 20px; display: flex; flex-direction: column; gap: 18px; opacity: 0.35">
    <div style="display: flex; justify-content: space-between; align-items: center"><span style="font-size: 34px; font-weight: 800; color: #FFFFFF">Sarvam.</span><span style="width: 56px; height: 56px; border-radius: 50%; background: #D9603B"></span></div>
    <div style="height: 44px; border-radius: 22px; background: #F4F5F2; width: 70%"></div>
    <div style="height: 180px; border-radius: 30px; background: #E9B44C"></div>
  </div>

  <section aria-label="Accessibility options" style="position: absolute; left: 0; right: 0; bottom: 0; background: #F4F5F2; border-top: 1.5px solid #1A1A1A; border-radius: 40px 40px 0 0; padding: 12px 20px 28px; display: flex; flex-direction: column; gap: 18px">
    <span aria-hidden="true" style="width: 44px; height: 5px; border-radius: 3px; background: #1A1A1A; opacity: .25; align-self: center"></span>
    <div style="display: flex; align-items: center; justify-content: space-between">
      <div style="display: flex; align-items: center; gap: 12px">
        <span style="width: 44px; height: 44px; box-sizing: border-box; border-radius: 50%; border: 3px solid #FADCD1; background: #D9603B; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="4.6" r="1.7" fill="#FFFFFF" stroke="none"></circle><path d="M5 8.6c2.4.8 4.6 1.1 7 1.1s4.6-.3 7-1.1"></path><path d="M12 9.8v4.4"></path><path d="M12 14.2l-3.4 6"></path><path d="M12 14.2l3.4 6"></path></svg></span>
        <h2 style="margin: 0; font-family: 'Fraunces', serif; font-weight: 400; font-size: 30px; line-height: 1">Make Sarvam easier<span style="color: #D9603B">.</span></h2>
      </div>
      <a href="04-home.html" aria-label="Close" style="width: 44px; height: 44px; box-sizing: border-box; border-radius: 50%; border: 1.5px solid #1A1A1A; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1A1A1A" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
    </div>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
      <sc-for list="{{tiles}}" as="t" hint-placeholder-count="6">
        <button onClick="{{t.toggle}}" aria-pressed="{{t.pressed}}" style="{{t.cardStyle}}">
          <span style="{{t.dotStyle}}">
            <sc-if value="{{t.isText}}" hint-placeholder-val="{{ false }}"><span style="{{t.glyphStyle}}">{{t.glyph}}</span></sc-if>
            <sc-if value="{{t.isSpeak}}" hint-placeholder-val="{{ false }}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="{{t.ink}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5v5h3.5L12 18V6L7.5 9.5z"></path><path d="M15.5 9a4 4 0 0 1 0 6"></path><path d="M18 6.5a7.5 7.5 0 0 1 0 11"></path></svg></sc-if>
            <sc-if value="{{t.isContrast}}" hint-placeholder-val="{{ false }}"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8" fill="none" stroke="{{t.ink}}" stroke-width="2.2"></circle><path d="M12 4a8 8 0 0 1 0 16z" fill="{{t.ink}}"></path></svg></sc-if>
            <sc-if value="{{t.isSimple}}" hint-placeholder-val="{{ false }}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="{{t.ink}}" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M5 7h14M5 12h10M5 17h6"></path></svg></sc-if>
            <sc-if value="{{t.isSlow}}" hint-placeholder-val="{{ false }}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="{{t.ink}}" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="13" r="7.5"></circle><path d="M12 9v4l2.5 2"></path><path d="M10 3h4"></path></svg></sc-if>
          </span>
          <span style="font-size: 13.5px; font-weight: 600; line-height: 1.2; text-align: center">{{t.label}}</span>
          <span style="{{t.stateStyle}}">{{t.stateText}}</span>
        </button>
      </sc-for>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <span style="font-size: 12.5px; font-weight: 700; letter-spacing: 1.2px; color: #575B58">TEXT SIZE</span>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
        <sc-for list="{{sizes}}" as="z" hint-placeholder-count="3">
          <button onClick="{{z.pick}}" aria-pressed="{{z.pressed}}" aria-label="{{z.label}}" style="{{z.style}}">A</button>
        </sc-for>
      </div>
    </div>

    <p style="margin: 0; font-size: 15px; line-height: 1.5; color: #3C3F3D; border: 1.5px solid #1A1A1A; border-radius: 28px; padding: 14px 16px">Preview: <span style="{{previewStyle}}">Your claim of ₹31,200 is approved.</span></p>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { on: { big: true, speak: false, contrast: false, simple: true, slow: false, lang: false }, size: 1 };
  }
  renderVals() {
    const defs = [
      { id: 'big', label: 'Larger text', color: '#D9603B', kind: 'text', glyph: 'Aa', ink: '#1A1A1A' },
      { id: 'speak', label: 'Read aloud', color: '#034F46', kind: 'speak', ink: '#F4F5F2' },
      { id: 'contrast', label: 'High contrast', color: '#1A1A1A', kind: 'contrast', ink: '#F4F5F2' },
      { id: 'simple', label: 'Simple words', color: '#E9B44C', kind: 'simple', ink: '#1A1A1A' },
      { id: 'slow', label: 'Slower voice', color: '#D9603B', kind: 'slow', ink: '#FFFFFF' },
      { id: 'lang', label: 'My language', color: '#CFE5E0', kind: 'text', glyph: 'அ', ink: '#1A1A1A' }
    ];
    const on = this.state.on;
    const tiles = defs.map((d) => {
      const active = !!on[d.id];
      return {
        label: d.label, glyph: d.glyph || '', ink: d.ink || '#FFFFFF',
        isText: d.kind === 'text', isSpeak: d.kind === 'speak', isContrast: d.kind === 'contrast', isSimple: d.kind === 'simple', isSlow: d.kind === 'slow',
        pressed: active ? 'true' : 'false', stateText: active ? 'On' : 'Off',
        cardStyle: 'display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 6px 12px;border-radius:22px;cursor:pointer;font-family:DM Sans,sans-serif;color:#1A1A1A;border:1.5px solid #1A1A1A;background:' + (active ? '#E9B44C' : 'transparent'),
        dotStyle: 'width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;box-sizing:border-box;border:1.5px solid #1A1A1A;background:' + d.color,
        glyphStyle: 'font-weight:800;font-size:20px;color:' + (d.ink || '#FFFFFF') + ";font-family:DM Sans,'Noto Sans Tamil',sans-serif",
        stateStyle: 'font-size:12px;font-weight:700;padding:2px 10px;border-radius:10px;' + (active ? 'background:#1A1A1A;color:#F4F5F2' : 'border:1.5px solid #1A1A1A;color:#1A1A1A'),
        toggle: () => this.setState({ on: { ...on, [d.id]: !on[d.id] } })
      };
    });
    const px = [16, 20, 26];
    const names = ['Normal text', 'Large text', 'Extra large text'];
    const sizes = px.map((p, i) => ({
      label: names[i], pressed: this.state.size === i ? 'true' : 'false',
      pick: () => this.setState({ size: i }),
      style: 'height:48px;border-radius:16px;cursor:pointer;font-family:DM Sans,sans-serif;font-weight:800;font-size:' + p + 'px;' + 'border:1.5px solid #1A1A1A;color:#1A1A1A;background:' + (this.state.size === i ? '#E9B44C' : 'transparent')
    }));
    return {
      tiles, sizes,
      previewStyle: 'font-size:' + px[this.state.size] + 'px;font-weight:700;' + (on.contrast ? 'background:#1A1A1A;color:#F4F5F2;padding:2px 4px' : 'color:#1A1A1A')
    };
  }
}
</script>
</body>
</html>
