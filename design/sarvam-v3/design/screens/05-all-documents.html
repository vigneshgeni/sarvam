<script>
window.DCLogic = class { constructor(p){ this.props = p || {}; this.state = this.state || {}; } setState(s){ Object.assign(this.state, s); } };
function look(scope, path){ path = path.trim(); if (path === 'true') return true; if (path === 'false') return false;
  let v = scope; for (const k of path.split('.')) { if (v == null) return undefined; v = v[k]; } return v; }
function interp(str, scope){ return str.replace(/\{\{\s*([^}]+?)\s*\}\}/g, (m, p) => { const v = look(scope, p); return typeof v === 'function' ? '' : (v == null ? '' : String(v)); }); }
function expand(node, scope){
  for (const child of Array.from(node.childNodes)) {
    if (child.nodeType === 3) { child.textContent = interp(child.textContent, scope); continue; }
    if (child.nodeType !== 1) continue;
    const tag = child.tagName.toLowerCase();
    if (tag === 'sc-for') {
      const m = (child.getAttribute('list')||'').match(/\{\{\s*([^}]+?)\s*\}\}/); const list = m ? look(scope, m[1]) || [] : [];
      const as = child.getAttribute('as') || 'item'; const frag = document.createDocumentFragment();
      list.forEach((it, i) => { const wrap = document.createElement('div'); wrap.innerHTML = child.innerHTML; const s = Object.assign({}, scope, {[as]: it, $index: i}); expand(wrap, s); while (wrap.firstChild) frag.appendChild(wrap.firstChild); });
      child.replaceWith(frag); continue;
    }
    if (tag === 'sc-if') {
      const m = (child.getAttribute('value')||'').match(/\{\{\s*([^}]+?)\s*\}\}/); const ok = m ? !!look(scope, m[1]) : false;
      if (!ok) { child.remove(); continue; }
      const frag = document.createDocumentFragment(); expand(child, scope); while (child.firstChild) frag.appendChild(child.firstChild); child.replaceWith(frag); continue;
    }
    for (const a of Array.from(child.attributes)) { if (a.value.includes('{{')) child.setAttribute(a.name, interp(a.value, scope)); }
    expand(child, scope);
  }
}
window.addEventListener('DOMContentLoaded', () => {
  const sc = document.querySelector('script[data-dc-script]');
  const C = new Function(sc.textContent + '; return Component;')();
  const props = {}; try { const dp = JSON.parse(sc.getAttribute('data-props')||'{}'); for (const k in dp) if (dp[k] && 'default' in dp[k]) props[k] = dp[k].default; } catch(e){}
  const inst = new C(props); const vals = inst.renderVals();
  const xdc = document.querySelector('x-dc'); const helmet = xdc.querySelector('helmet');
  if (helmet) { document.head.insertAdjacentHTML('beforeend', helmet.innerHTML); helmet.remove(); }
  expand(xdc, vals); window.__ready = true; document.dispatchEvent(new Event('sv-ready'));
});
</script>
<style>
@keyframes sv-push-in{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes sv-back-in{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
@keyframes sv-sheet-up{from{transform:translateY(100%)}to{transform:none}}
@keyframes sv-scrim-in{from{opacity:0}to{opacity:1}}
@keyframes sv-fade-up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.sv-out{transition:opacity 160ms ease-in, transform 160ms ease-in;opacity:0;transform:translateX(-14px)}
.sv-out-back{transition:opacity 160ms ease-in, transform 160ms ease-in;opacity:0;transform:translateX(14px)}
.sv-sheet-out{transition:transform 200ms cubic-bezier(.4,0,1,1);transform:translateY(100%)}
@media (prefers-reduced-motion: reduce){*{animation-duration:1ms!important;animation-iteration-count:1!important;transition-duration:1ms!important}}
</style>
<script>
(function(){
  const SHEET = false;
  function root(){ const x = document.querySelector('x-dc'); return x && x.firstElementChild; }
  function sheetEl(r){ return r && Array.from(r.querySelectorAll('section')).find(s => s.style.position === 'absolute' && (s.style.borderRadius||'').startsWith('40px 40px')); }
  function enter(){
    const r = root(); if (!r) return;
    const back = location.hash === '#back';
    if (SHEET) {
      const s = sheetEl(r);
      r.style.animation = 'sv-scrim-in 200ms ease-out both';
      if (s) s.style.animation = back ? 'none' : 'sv-sheet-up 260ms cubic-bezier(.2,.8,.2,1) both';
    } else {
      r.style.animation = (back ? 'sv-back-in' : 'sv-push-in') + ' 280ms cubic-bezier(.2,.8,.2,1) both';
      const cards = Array.from(r.querySelectorAll('.stack > section, .stack > details, .stack > nav'));
      cards.slice(0, 10).forEach((c, i) => { c.style.animation = 'sv-fade-up 320ms cubic-bezier(.2,.8,.2,1) both'; c.style.animationDelay = (120 + i * 40) + 'ms'; });
    }
  }
  document.addEventListener('sv-ready', enter);
  document.addEventListener('click', (e) => {
    const a = e.target.closest('a[href]'); if (!a) return;
    const href = a.getAttribute('href'); if (!/^\d\d-[a-z0-9-]+\.html/.test(href)) return;
    e.preventDefault();
    const label = (a.getAttribute('aria-label') || '').toLowerCase();
    const back = label === 'back' || label === 'close';
    const r = root(); const s = sheetEl(r);
    if (SHEET && back && s) s.classList.add('sv-sheet-out'); else if (r) r.classList.add(back ? 'sv-out-back' : 'sv-out');
    setTimeout(() => { location.href = href + (back ? '#back' : ''); }, SHEET && back ? 200 : 160);
  });
})();
</script>
<style>html,body{background:#E8EAE7}body{margin:0}x-dc>div{margin:0 auto}</style>

<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
body{margin:0}
a{color:#034F46}a:hover{color:#1A1A1A}
.stack > *{flex-shrink:0}
.chips::-webkit-scrollbar{display:none}

</helmet>
<div class="stack" style="width: 390px; height: 1560px; box-sizing: border-box; background: #F4F5F2; font-family: DM Sans, system-ui, sans-serif; color: #1A1A1A; padding: 16px 20px 32px; display: flex; flex-direction: column; gap: 16px; overflow: hidden">
  <div style="display: flex; align-items: center; gap: 12px">
    <a href="04-home.html" aria-label="Back to Home" style="width: 48px; height: 48px; flex: none; box-sizing: border-box; border-radius: 50%; border: 1.5px solid #1A1A1A; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1A1A1A" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <span style="flex: 1"></span>
    <button style="height: 44px; padding: 0 16px; border-radius: 22px; border: 1.5px solid #1A1A1A; background: transparent; font: 600 14px DM Sans, sans-serif; color: #B3361A">Delete all</button>
  </div>

  <div style="display: flex; align-items: baseline; justify-content: space-between">
    <h1 style="margin: 0; font-family: 'Fraunces', serif; font-weight: 400; font-size: 42px; line-height: 1; letter-spacing: -0.5px">All documents<span style="color: #D9603B">.</span></h1>
    <span style="font-size: 14px; font-weight: 600; color: #575B58">12 saved</span>
  </div>

  <div style="display: flex; align-items: center; gap: 10px; height: 52px; box-sizing: border-box; padding: 0 16px; border: 1.5px solid #1A1A1A; border-radius: 26px; position: relative">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1A1A1A" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4.5 4.5"></path></svg>
    <label for="q" style="position: absolute; width: 1px; height: 1px; overflow: hidden">Search your documents</label>
    <input id="q" placeholder="Search by name or type" style="flex: 1; min-width: 0; border: 0; background: transparent; font: 500 15.5px DM Sans, sans-serif; color: #1A1A1A; outline: none">
  </div>

  <div class="chips" style="display: flex; gap: 8px; overflow-x: auto; margin-right: -20px; padding-right: 20px">
    <sc-for list="{{filters}}" as="f" hint-placeholder-count="7">
      <button style="{{f.style}}">{{f.label}}</button>
    </sc-for>
  </div>

  <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
    <div style="display: flex; flex-direction: column; gap: 10px">
      <span style="font-size: 12.5px; font-weight: 700; letter-spacing: 1.2px; color: #575B58; margin-top: 4px">{{g.label}}</span>
      <sc-for list="{{g.items}}" as="r" hint-placeholder-count="4">
        <div style="display: flex; align-items: center; gap: 12px; padding: 12px 8px 12px 12px; border: 1.5px solid #1A1A1A; border-radius: 28px">
          <a href="10-result-insurance.html" style="display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; text-decoration: none; color: #1A1A1A">
            <span style="{{r.tile}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{r.ink}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{r.icon}}"></path></svg></span>
            <span style="display: flex; flex-direction: column; gap: 3px; flex: 1; min-width: 0"><span style="font-size: 15.5px; font-weight: 600; line-height: 1.3">{{r.title}}</span><span style="font-size: 13px; color: #575B58">{{r.type}} · {{r.date}}</span></span>
          </a>
          <button aria-label="Remove" style="width: 44px; height: 44px; flex: none; border: 0; border-radius: 50%; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#575B58" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
        </div>
      </sc-for>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1560}}'>
class Component extends DCLogic {
  renderVals() {
    const I = {
      rupee: ['M7 5h10M7 9h10M7 5c6 0 6 8 0 8l7 7', '#D9603B', '#1A1A1A'],
      stamp: ['M6 3h8l4 4v14H6zM14 3v4h4M12 11.4a2.6 2.6 0 1 0 0 5.2a2.6 2.6 0 1 0 0-5.2', '#CFE5E0', '#1A1A1A'],
      shield: ['M12 3l8 3v6c0 4.5-3.4 8-8 9-4.6-1-8-4.5-8-9V6zM12 9v6M9 12h6', '#E9B44C', '#1A1A1A'],
      flask: ['M9 3h6M10 3v6l-5 9a2 2 0 0 0 1.7 3h10.6a2 2 0 0 0 1.7-3l-5-9V3M7.5 15h9', '#034F46', '#F4F5F2'],
      pill: ['M4.5 15.5l8-8a4 4 0 0 1 5.6 5.6l-8 8a4 4 0 0 1-5.6-5.6zM8.5 11.5l5.6 5.6', '#CFE5E0', '#1A1A1A'],
      bolt: ['M13 2L5 13h6l-1 9 8-11h-6z', '#E9B44C', '#1A1A1A'],
      wifi: ['M4 9.5a12 12 0 0 1 16 0M7 13a7.5 7.5 0 0 1 10 0M10 16.5a3 3 0 0 1 4 0M12 20h.01', '#1A1A1A', '#F4F5F2'],
      car: ['M4 16v-4l2-5h12l2 5v4zM8 16.5a1.8 1.8 0 1 0 0 .1M16 16.5a1.8 1.8 0 1 0 0 .1', '#D9603B', '#FFFFFF'],
      house: ['M4 11l8-7 8 7v9H4zM10 20v-5h4v5', '#CFE5E0', '#1A1A1A'],
      gavel: ['M14 4l6 6M11 7l6 6M12.5 5.5l-5 5M3 21l7-7M8 12l4 4', '#1A1A1A', '#F4F5F2'],
      bank: ['M3 10l9-6 9 6M5 10v8M9.5 10v8M14.5 10v8M19 10v8M3 20h18', '#F8D9CB', '#1A1A1A'],
      pen: ['M4 20l4-1 11-11-3-3L5 16zM14 6l3 3M4 20h16', '#F4F5F2', '#1A1A1A']
    };
    const row = (title, type, date, k) => ({ title, type, date, icon: I[k][0], ink: I[k][2], tile: 'width:46px;height:46px;flex:none;box-sizing:border-box;border-radius:16px;border:1.5px solid #1A1A1A;display:flex;align-items:center;justify-content:center;background:' + I[k][1] });
    const groups = [
      { label: 'THIS WEEK', items: [
        row('Old Age Pension Life Certificate Notice', 'Pension', 'Oct 14', 'rupee'),
        row('Prescription from Dr. S. Rao Clinic', 'Prescription', 'Oct 13', 'pill'),
        row('Notice to Pensioners: Life Certificate Submission', 'Govt notice', 'Oct 13', 'stamp'),
        row('Hospitalisation Claim Settlement Letter', 'Insurance', 'Oct 12', 'shield')
      ] },
      { label: 'EARLIER IN OCTOBER', items: [
        row('Medical Diagnostic Report', 'Lab report', 'Oct 9', 'flask'),
        row('BESCOM Electricity Bill, September', 'Electricity bill', 'Oct 6', 'bolt'),
        row('Broadband Invoice, September', 'Internet bill', 'Oct 4', 'wifi'),
        row('Traffic e-challan: riding without helmet', 'Challan', 'Oct 6', 'car')
      ] },
      { label: 'SEPTEMBER', items: [
        row('Property Tax Demand Notice 2026-27', 'Property tax', 'Sep 28', 'house'),
        row('Court summons: civil suit hearing', 'Court paper', 'Sep 21', 'gavel'),
        row('Fixed Deposit Renewal Advice', 'Bank', 'Sep 15', 'bank'),
        row('Rental Agreement, Indiranagar flat', 'Agreement', 'Sep 3', 'pen')
      ] }
    ];
    const chip = (sel) => 'flex:none;height:40px;padding:0 16px;border-radius:20px;border:1.5px solid #1A1A1A;font:' + (sel ? '700' : '600') + ' 14px DM Sans,sans-serif;color:#1A1A1A;background:' + (sel ? '#E9B44C' : 'transparent');
    const filters = ['All 12', 'Health 3', 'Money 3', 'Bills 2', 'Notices 2', 'Legal 2'].map((label, i) => ({ label, style: chip(i === 0) }));
    return { groups, filters };
  }
}
</script>
