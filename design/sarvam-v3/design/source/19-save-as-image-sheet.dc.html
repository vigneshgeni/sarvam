<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Save as image</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&amp;family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&amp;display=swap">
<style>
body{margin:0}
a{color:#034F46}a:hover{color:#1A1A1A}
@keyframes shot{0%,70%,100%{opacity:0}74%{opacity:.9}}
.shot{animation:shot 3.6s ease-out infinite}
@media (prefers-reduced-motion: reduce){.shot{animation:none}}
.b{display:block;border-radius:6px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #8A8F8C; font-family: DM Sans, system-ui, sans-serif; color: #1A1A1A; position: relative; overflow: hidden">
    <section aria-label="Save as image" style="position: absolute; left: 0; right: 0; bottom: 0; top: 60px; background: #F4F5F2; border-top: 1.5px solid #1A1A1A; border-radius: 40px 40px 0 0; padding: 12px 20px 24px; display: flex; flex-direction: column; gap: 14px">
    <span aria-hidden="true" style="width: 44px; height: 5px; border-radius: 3px; background: #1A1A1A; opacity: .25; align-self: center"></span>
    <div style="display: flex; align-items: center; justify-content: space-between">
      <h2 style="margin: 0; font-family: 'Fraunces', serif; font-weight: 400; font-size: 34px; line-height: 1">Save as image<span style="color: #D9603B">.</span></h2>
      <a href="Share.dc.html" aria-label="Close" style="width: 44px; height: 44px; box-sizing: border-box; border-radius: 50%; border: 1.5px solid #1A1A1A; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1A1A1A" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
    </div>

    <div style="display: flex; gap: 14px; align-items: stretch">
      <div aria-label="Preview of the image" role="img" style="width: 140px; height: 260px; flex: none; box-sizing: border-box; border: 1.5px solid #1A1A1A; border-radius: 20px; background: #F4F5F2; padding: 10px; display: flex; flex-direction: column; gap: 6px; position: relative; overflow: hidden; transform: rotate(-3deg)">
        <span style="font-size: 10px; font-weight: 700">Sarvam<span style="color: #D9603B">.</span></span>
        <span class="b" style="height: 46px; border: 1.2px solid #1A1A1A; background: #F4F5F2"></span>
        <span class="b" style="height: 12px; display: flex; overflow: hidden; border: 1.2px solid #1A1A1A"><span style="width: 64%; background: #034F46"></span><span style="flex: 1; background: #D9603B"></span></span>
        <span class="b" style="height: 52px; background: #E9B44C; border: 1.2px solid #1A1A1A"></span>
        <span class="b" style="height: 30px; border: 1.2px solid #1A1A1A"></span>
        <span class="b" style="height: 20px; background: #D9603B; border: 1.2px solid #1A1A1A"></span>
        <span class="b" style="height: 40px; background: #1A1A1A"></span>
        <span style="font-size: 7px; color: #575B58">Explained by Sarvam · not the original</span>
        <span class="shot" aria-hidden="true" style="position: absolute; inset: 0; background: #F4F5F2"></span>
      </div>
      <div style="flex: 1; display: flex; flex-direction: column; gap: 10px; justify-content: center">
        <span style="font-size: 14.5px; line-height: 1.4">The whole explanation as one tall image. Keep it in Photos, or send it to family or your doctor.</span>
        <span style="display: inline-flex; align-self: flex-start; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border-radius: 15px; border: 1.5px solid #1A1A1A; background: #CFE5E0; font-size: 12.5px; font-weight: 700">Works offline</span>
      </div>
    </div>

    <div style="display: flex; padding: 3px; border-radius: 24px; border: 1.5px solid #1A1A1A">
      <button style="flex: 1; height: 38px; border-radius: 19px; border: 0; background: #E9B44C; font: 700 14px DM Sans, sans-serif">Whole page</button>
      <button style="flex: 1; height: 38px; border-radius: 19px; border: 0; background: transparent; font: 600 14px DM Sans, sans-serif; color: #575B58">Summary only</button>
    </div>

    <label style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 24px; border: 1.5px solid #1A1A1A; position: relative">
      <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 700">Hide personal details</span><span style="font-size: 12.5px; color: #575B58">Names, numbers and IDs masked in the image</span></span>
      <input type="checkbox" checked="checked" aria-label="Hide personal details" style="position: absolute; opacity: 0; width: 1px; height: 1px">
      <span aria-hidden="true" style="width: 54px; height: 32px; box-sizing: border-box; border-radius: 16px; background: #034F46; border: 1.5px solid #1A1A1A; position: relative; flex: none"><span style="position: absolute; top: 2px; right: 2px; width: 24px; height: 24px; border-radius: 50%; background: #E9B44C"></span></span>
    </label>

    <div style="margin-top: auto; display: flex; gap: 10px">
      <button style="flex: 1; height: 56px; border-radius: 28px; border: 1.5px solid #1A1A1A; background: transparent; font: 600 16px DM Sans, sans-serif">Share image</button>
      <button style="flex: 1.2; height: 56px; border-radius: 28px; border: 1.5px solid #1A1A1A; background: #E9B44C; font: 700 16px DM Sans, sans-serif; display: flex; align-items: center; justify-content: center; gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1A1A1A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7.5 10.5L12 15l4.5-4.5M5 19h14"></path></svg>Save to Photos</button>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
