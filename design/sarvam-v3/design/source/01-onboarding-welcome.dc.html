<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Welcome to Sarvam</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&amp;family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&amp;family=Noto+Sans+Tamil:wght@600&amp;family=Noto+Sans+Devanagari:wght@600&amp;family=Noto+Sans+Telugu:wght@600&amp;family=Noto+Sans+Malayalam:wght@600&amp;family=Noto+Sans+Bengali:wght@600&amp;family=Noto+Sans+Oriya:wght@600&amp;family=Noto+Sans+Kannada:wght@600&amp;display=swap">
<style>
body{margin:0}
a{color:#034F46}a:hover{color:#1A1A1A}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.pill{animation:floaty 4s ease-in-out infinite}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F5F2; font-family: DM Sans, system-ui, sans-serif; color: #1A1A1A; padding: 20px 20px 28px; display: flex; flex-direction: column; gap: 22px">
  <div style="display: flex; align-items: center; justify-content: space-between">
    <span style="font-size: 26px; font-weight: 700; letter-spacing: -0.8px">Sarvam<span style="color: #D9603B">.</span></span>
    <a href="Main.dc.html" style="height: 44px; display: inline-flex; align-items: center; padding: 0 16px; font-size: 15px; font-weight: 600; color: #1A1A1A; text-decoration: none">Skip</a>
  </div>

  <div style="flex: 1; background: #034F46; border-radius: 40px; position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 9px; padding: 20px">
    <span aria-hidden="true" style="position: absolute; width: 220px; height: 220px; border-radius: 50%; border: 2px dashed #3E7F75; top: 50%; left: 50%; transform: translate(-50%, -50%)"></span>
    <sc-for list="{{greet}}" as="g" hint-placeholder-count="9">
      <span class="pill" style="{{g.style}}">{{g.word}}</span>
    </sc-for>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px">
    <h1 style="margin: 0; font-family: 'Fraunces', serif; font-weight: 400; font-size: 42px; line-height: 1.02; letter-spacing: -0.5px">Read any document, in your language.</h1>
    <p style="margin: 0; font-size: 16px; line-height: 1.4; color: #3B3E3C">Photograph a bill, letter or report. Sarvam reads it in Tamil, Hindi, Telugu and six more.</p>
  </div>

  <div style="display: flex; align-items: center; justify-content: space-between">
    <span aria-label="Step 1 of 3" style="display: flex; gap: 6px"><span style="width: 26px; height: 8px; border-radius: 4px; background: #1A1A1A"></span><span style="width: 8px; height: 8px; border-radius: 4px; background: #C4C8C3"></span><span style="width: 8px; height: 8px; border-radius: 4px; background: #C4C8C3"></span></span>
    <a href="Onboard2.dc.html" style="height: 56px; display: inline-flex; align-items: center; gap: 10px; padding: 0 26px; border-radius: 28px; border: 1.5px solid #1A1A1A; background: #E9B44C; color: #1A1A1A; font-size: 17px; font-weight: 700; text-decoration: none">Next<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1A1A1A" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const G = [
      ['வணக்கம்', 'Noto Sans Tamil', '#F4F5F2', '#1A1A1A'], ['नमस्ते', 'Noto Sans Devanagari', '#E9B44C', '#1A1A1A'], ['నమస్కారం', 'Noto Sans Telugu', '#D9603B', '#1A1A1A'],
      ['നമസ്കാരം', 'Noto Sans Malayalam', '#1A1A1A', '#F4F5F2'], ['नमस्कार', 'Noto Sans Devanagari', '#F4F5F2', '#1A1A1A'], ['নমস্কার', 'Noto Sans Bengali', '#E9B44C', '#1A1A1A'],
      ['ନମସ୍କାର', 'Noto Sans Oriya', '#D9603B', '#1A1A1A'], ['ನಮಸ್ಕಾರ', 'Noto Sans Kannada', '#1A1A1A', '#F4F5F2'], ['Hello', 'DM Sans', '#F4F5F2', '#1A1A1A']
    ];
    const shifts = [-46, 34, -22, 50, -54, 20, -30, 42, -6];
    const greet = G.map(([word, f, bg, ink], i) => ({
      word,
      style: 'position:relative;display:inline-flex;align-items:center;height:36px;padding:0 16px;border-radius:18px;border:1.5px solid #1A1A1A;font-size:16px;font-weight:600;font-family:' + f + ',sans-serif;background:' + bg + ';color:' + ink + ';margin-left:' + Math.round(shifts[i] * 1.4) + 'px;rotate:' + (i % 2 ? 3 : -3) + 'deg;animation-delay:' + (i * 0.35) + 's'
    }));
    return { greet };
  }
}
</script>
</body>
</html>
